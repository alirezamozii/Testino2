name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Run verification checks (lint, typecheck, tests)
        run: npm run check

      - name: Build web assets
        run: npm run build:web
        env:
          NO_BUMP: "true"

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: testino-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Version Meta
        uses: actions/upload-artifact@v4
        with:
          name: testino-version-meta
          path: public/version.json

  build-windows:
    name: Package Windows Desktop App
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static web bundle
        run: npm run build:web
        env:
          NO_BUMP: "true"

      - name: Package Windows Portable & Executable
        run: node scripts/package-desktop.mjs

      - name: Upload Windows Package
        uses: actions/upload-artifact@v4
        with:
          name: testino-windows-zip
          path: dist/Testino-Windows-x64.zip

  publish-release:
    name: Publish Release
    needs: [build-android, build-windows]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: testino-android-apk
          path: ./release-files

      - name: Download Windows Package
        uses: actions/download-artifact@v4
        with:
          name: testino-windows-zip
          path: ./release-files

      - name: Download Version Meta
        uses: actions/download-artifact@v4
        with:
          name: testino-version-meta
          path: ./release-files

      - name: Determine Tag
        id: tag_step
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG" ] || [ "$TAG" = "refs/heads/main" ]; then
            TAG="v$(node -p "require('./release-files/version.json').version")-build$(node -p "require('./release-files/version.json').build")"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Testino Release ${{ steps.tag_step.outputs.tag }}"
          tag_name: ${{ steps.tag_step.outputs.tag }}
          files: |
            release-files/app-debug.apk
            release-files/Testino-Windows-x64.zip
            release-files/version.json
          draft: false
          prerelease: false
