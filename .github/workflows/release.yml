name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    name: Build & Verify Web Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Run verification checks (lint, typecheck, tests)
        run: npm run check

      - name: Build web static bundle
        run: npm run build:web
        env:
          NO_BUMP: "true"

      - name: Upload Web Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: testino-web-out
          path: out
          retention-days: 1

      - name: Upload Version Meta
        uses: actions/upload-artifact@v4
        with:
          name: testino-version-meta
          path: public/version.json
          retention-days: 1

      - name: Cleanup temporary build files
        if: always()
        run: |
          rm -rf out .next/cache

  build-android:
    name: Build Android APK
    needs: [build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Download Web Bundle
        uses: actions/download-artifact@v4
        with:
          name: testino-web-out
          path: out

      - name: Ensure Gradle Wrapper exists
        run: |
          mkdir -p android/gradle/wrapper
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.14.3/gradle/wrapper/gradle-wrapper.jar -o android/gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Sync Capacitor Android project
        run: npx cap sync android

      # Decode the release keystore from repo secrets when provided.
      # When secrets are absent the Gradle config falls back to debug signing
      # automatically, so assembleRelease always succeeds and produces an installable APK.
      - name: Decode Release Keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          echo "KEYSTORE_PATH=release.keystore" >> $GITHUB_ENV

      - name: Build Android APK (signed release)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: testino-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Cleanup temporary Android build files
        if: always()
        run: |
          rm -f android/app/release.keystore
          rm -rf out android/app/build android/build android/.gradle

  build-windows:
    name: Package Windows Desktop App
    needs: [build-web]
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        env:
          ELECTRON_INSTALL_PLATFORM: win32
          ELECTRON_INSTALL_ARCH: x64
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Download Web Bundle
        uses: actions/download-artifact@v4
        with:
          name: testino-web-out
          path: out

      - name: Package Windows Portable & Executable
        run: node scripts/package-desktop.mjs

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: testino-windows-dist
          path: |
            dist/Testino-Windows-x64.zip
            dist/Testino-Setup-x64.exe
          if-no-files-found: ignore

      - name: Cleanup temporary Windows build files
        if: always()
        shell: bash
        run: |
          rm -rf out dist/Testino-win-x64

  publish-release:
    name: Publish Release
    needs: [build-android, build-windows]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: testino-android-apk
          path: ./release-files

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: testino-windows-dist
          path: ./release-files

      - name: Download Version Meta
        uses: actions/download-artifact@v4
        with:
          name: testino-version-meta
          path: ./release-files

      - name: Prepare Release Assets and Tag
        id: release_info
        run: |
          # Copy APK to branded filename
          if [ -f release-files/app-release.apk ]; then
            cp release-files/app-release.apk release-files/Testino-Android.apk
          fi

          VERSION=$(node -p "try { require('./release-files/version.json').version } catch(e) { '0.1.8' }")
          BUILD_NUM=$(node -p "try { require('./release-files/version.json').build } catch(e) { '${{ github.run_number }}' }")

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${VERSION}-b${{ github.run_number }}"
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD_NUM" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "نسخه ${{ steps.release_info.outputs.version }} (بیلد ${{ steps.release_info.outputs.build }})"
          tag_name: ${{ steps.release_info.outputs.tag }}
          files: |
            release-files/Testino-Android.apk
            release-files/Testino-Setup-x64.exe
            release-files/Testino-Windows-x64.zip
            release-files/version.json
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🚀 انتشار خودکار نسخه جدید تستیونو (Testino)

            تمامی آزمون‌های خودکار کیفیت، ارزیابی ساختار تایپ‌ها، تحلیل کدهای فرانت‌اند و فرآیند کامپایل کامل، با موفقیت ۱۰۰٪ سبز سپری شدند و فایل‌های اجرایی آماده استفاده می‌باشند.

            ### 📦 فایل‌های قابل دانلود:
            - 💻 **نصب‌کننده رسمی ویندوز (توصیه‌شده)**: فایل نصبی آسان `Testino-Setup-x64.exe` با فشردگی بالا، ایجاد شورتکات دسکتاپ و منوی استارت و آیکون اختصاصی
            - 💻 **نسخه پرتابل ویندوز**: فایل فشرده `Testino-Windows-x64.zip` (شامل `Testino.exe` - بدون نیاز به نصب)
            - 📱 **نسخه اندروید**: فایل `Testino-Android.apk` جهت نصب روی گوشی‌ها و تبلت‌های اندروید
            - 📋 **اطلاعات نسخه**: `version.json`


      - name: Cleanup release files
        if: always()
        run: |
          rm -rf release-files dist out



