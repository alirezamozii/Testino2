name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - run: npm run check
      - run: npm run build:web
        env:
          NO_BUMP: "true"

      - name: Cleanup temporary build files
        if: always()
        run: |
          rm -rf out .next/cache

  e2e:
    name: E2E (freeze watchdog + journeys)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build:web
        env:
          NO_BUMP: "true"

      - name: Run E2E suite (real failure detection — no fake passes)
        run: npx playwright test --project=desktop
        env:
          CI: "true"

      - name: Run mobile + tablet smoke & overflow suite
        run: npx playwright test --project=mobile --project=tablet
        if: always()
        env:
          CI: "true"

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            artifacts/test-results/
            playwright-report/
          retention-days: 7
