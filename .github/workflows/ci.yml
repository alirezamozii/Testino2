name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - run: npm run check
      - run: npm run build:web
        env:
          NO_BUMP: "true"

      - name: Cleanup temporary build files
        if: always()
        run: |
          rm -rf out .next/cache

